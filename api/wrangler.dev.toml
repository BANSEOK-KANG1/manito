# 시험용(game 브랜치) — 친구들이 쓰는 manito-api 와 완전히 분리된 서버·저장소
name = "manito-dev"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 시험 서버라서 공개 시간을 1분 뒤로도 잡을 수 있게 (운영은 기본 10분)
[vars]
MIN_REVEAL_MIN = "1"
LOG_PAYLOADS = "1"   # 단톡방 요청 모양 확인용: 최근 20개를 남긴다 (GET /kakao/debug)

[assets]
directory = "./public-dev"
binding = "ASSETS"

[[kv_namespaces]]
binding = "OLDKV"
id = "872ed9adb6c944d9a04943990d87d7e5"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "BOX"
class_name = "Box"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Box"]
